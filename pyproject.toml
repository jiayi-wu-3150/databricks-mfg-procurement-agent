[project]
name = "agent-server-advanced"
version = "0.1.0"
description = "MLflow-compatible agent server with short-term memory and long-running background task support"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "mlflow>=3.10.1",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "uuid-utils>=0.10.0",
    "databricks-openai[memory]>=0.15.0",
    "databricks-sdk>=0.79.0",
    "databricks-agents>=1.9.3",
    "databricks-ai-bridge[agent-server]>=0.19.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    # Azure UC managed storage is abfss:// — MLflow needs these to upload trace/model artifacts.
    "azure-storage-file-datalake>=12.14.0",
    "azure-identity>=1.19.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]

setup = [
    "ruamel.yaml>=0.18.0",
]

[tool.uv]
default-groups = ["dev", "setup"]
# matplotlib (via mlflow, required transitively by databricks-mcp/databricks-openai) drags
# pillow. On the Databricks package proxy, pillow 12.3.0 ships only manylinux_2_27/2_28 wheels
# and 11.3.0 has no cp311/312 manylinux wheel at all — both fail the app build. 12.2.0 is the
# version carrying BOTH manylinux2014 and manylinux_2_28 wheels, so pin to it.
override-dependencies = ["pillow==12.2.0"]

[tool.pytest.ini_options]
base_url = "http://localhost:8000"
addopts = "-n 7"

[project.scripts]
quickstart = "scripts.quickstart:main"
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
agent-evaluate = "agent_server.evaluate_agent:evaluate"
discover-tools = "scripts.discover_tools:main"
preflight = "scripts.preflight:main"
